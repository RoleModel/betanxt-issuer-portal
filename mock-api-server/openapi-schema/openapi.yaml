          type: string
          nullable: true
          example: null
        controlNumber:
          type: string
          nullable: true
          example: null
        voteStatus:
          type: string
          enum: [Voted, Unvoted]
          example: "Unvoted"
        shares:
          type: number
          format: double
          example: 132463881.0
        sharesVoted:
          type: number
          format: double
          example: 0

  # Voting Endpoints (Supabase PostgREST)
  # Note: Supabase auto-generates endpoints based on table names
  /position_votes:
    get:
      operationId: getPositionVotes
      summary: Get position votes
      description: |
        Get position votes using Supabase PostgREST filters.

        Common usage examples:
        - Get votes for a position: `?positionId=eq.{uuid}`
        - Get votes for a proposal: `?proposalId=eq.{uuid}`
        - Include related data: `?select=*,positions(*),proposals(*)`
        - Order by date: `?order=createdAt.desc`

        Supabase operators:
        - `eq` - equals
        - `neq` - not equals
        - `gt` - greater than
        - `gte` - greater than or equal
        - `lt` - less than
        - `lte` - less than or equal
        - `like` - LIKE operator
        - `ilike` - ILIKE operator
        - `in` - one of a list of values
        - `is` - checking for null/not null
      tags: [Voting]
      parameters:
        - name: positionId
          in: query
          required: false
          schema:
            type: string
          description: Filter by position ID (e.g., `eq.123e4567-e89b-12d3-a456-426614174000`)
        - name: proposalId
          in: query
          required: false
          schema:
            type: string
          description: Filter by proposal ID (e.g., `eq.123e4567-e89b-12d3-a456-426614174000`)
        - name: vote
          in: query
          required: false
          schema:
            type: string
          description: Filter by vote type (e.g., `eq.FOR`, `eq.AGAINST`, `eq.ABSTAIN`)
        - name: select
          in: query
          required: false
          schema:
            type: string
          description: Specify columns and embed related resources (e.g., `*,positions(name,cusip)`)
        - name: order
          in: query
          required: false
          schema:
            type: string
          description: Order results (e.g., `createdAt.desc`, `sharesVoting.asc`)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Limit number of results
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: Number of results to skip for pagination
      responses:
        '200':
          description: Position votes retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionVote'
          headers:
            Content-Range:
              description: Pagination info (e.g., `0-9/100`)
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createPositionVote
      summary: Create a position vote
      description: |
        Create a new position vote record.

        Note: In Supabase PostgREST, you POST directly to the table endpoint.
        The positionId should be included in the request body, not the URL path.
      tags: [Voting]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CastVoteRequest'
      responses:
        '201':
          description: Vote cast successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionVote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'


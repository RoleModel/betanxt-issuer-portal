components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    # Enums
    UserType:
      type: string
      enum: [ADMIN, ISSUER, RELATIONSHIP_MANAGER]

    MeetingStatus:
      type: string
      enum: [ACTIVE, COMPLETE, ADJOURNED]

    PhaseStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETE]

    TaskStatus:
      type: string
      enum: [INCOMPLETE, COMPLETE, CANCELLED, NEEDS_AUTHORIZATION, AUTHORIZED]

    DocumentStatus:
      type: string
      enum: [DRAFT, UPLOADED, IN_PROGRESS, SIGNED, AUTHORIZED, COMPLETED]

    # Core Models
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        primaryContact:
          type: string
        clientId:
          type: string
          format: uuid
          description: The client this account belongs to
        createdAt:
          type: string
          format: date-time
        client:
          $ref: '#/components/schemas/Client'
          description: The client this account belongs to (relationship)

    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticker:
          type: string
          description: Unique ticker symbol for the client
        companyName:
          type: string
          description: Full legal name of the company
        shortName:
          type: string
          description: Short display name for the company
        industry:
          type: string
          nullable: true
          description: Industry sector
        description:
          type: string
          nullable: true
          description: Company description
        website:
          type: string
          nullable: true
          description: Company website URL
        primaryContact:
          type: string
          nullable: true
          description: Primary contact person
        primaryContactEmail:
          type: string
          format: email
          nullable: true
          description: Primary contact email
        isActive:
          type: boolean
          default: true
          description: Whether the client is active
        brandingId:
          type: integer
          nullable: true
          description: Unique branding identifier for document hosting site URLs
          example: 966152
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        accounts:
          type: object
          nullable: true
          description: JSON array of related account information
        meetings:
          type: object
          nullable: true
          description: JSON array of related meeting information

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          nullable: true
          description: 'Legacy password field for seed data - not used with NextAuth'
        type:
          $ref: '#/components/schemas/UserType'
        accountId:
          type: string
          format: uuid
          nullable: true
        account:
          $ref: '#/components/schemas/Account'

    Meeting:
      type: object
      properties:
        id:
          type: string
          example: "01234567-89ab-cdef-0123-456789abcdef"
        title:
          type: string
          example: "2025 Annual Shareholder Meeting"
        cusip:
          type: string
          example: "12345A678"
        ticker:
          type: string
          example: "ACME"
        preFilingDate:
          type: string
          format: date
          nullable: true
          example: "2025-02-15"
        filingDate:
          type: string
          format: date
          nullable: true
          example: "2025-03-01"
        brokerSearchDate:
          type: string
          format: date
          nullable: true
          example: "2025-03-15"
        recordDate:
          type: string
          format: date
          example: "2025-04-01"
        mailingDate:
          type: string
          format: date
          example: "2025-04-15"
        meetingDate:
          type: string
          format: date
          example: "2025-05-15"
        meetingType:
          type: string
        meetingYear:
          type: integer
          example: 2025
        status:
          $ref: '#/components/schemas/MeetingStatus'
        currentPhase:
          type: string
          example: "Notice & Access"
        overallCompletion:
          type: integer
          minimum: 0
          maximum: 100
          example: 75
        distributionType:
          type: string
          example: "Notice & Access"
        transferAgent:
          type: string
          example: "Computershare Trust Company"
        employeeStockPlans:
          type: string
          nullable: true
        planAdministrator:
          type: string
          nullable: true
        planAdministratorContact:
          type: string
          nullable: true
        planAdministratorContactEmail:
          type: string
          format: email
          nullable: true
        solicitor:
          type: string
          nullable: true
        solicitorEmail:
          type: string
          format: email
          nullable: true
        inspector:
          type: string
          nullable: true
        ivrDialInNumber:
          type: string
          nullable: true
          description: IVR dial-in voting number (e.g., "1-800-555-VOTE")
        totalSharesOutstanding:
          type: string
          format: int64
        quorumRequirement:
          type: number
          format: decimal
        clientId:
          type: string
          format: uuid
          description: The client this meeting belongs to
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        client:
          $ref: '#/components/schemas/Client'
          description: The client this meeting belongs to (relationship)

    Phase:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "11111111-2222-3333-4444-555555555555"
        meetingId:
          type: string
          format: uuid
          x-foreign-key: meeting.id
          example: "01234567-89ab-cdef-0123-456789abcdef"
        name:
          type: string
          example: "Notice & Access"
        orderIndex:
          type: integer
          example: 1
        status:
          $ref: '#/components/schemas/PhaseStatus'
        keyDates:
          type: object
          nullable: true
          properties:
            startDate:
              type: string
              format: date
              nullable: true
              example: "2025-03-01"
            endDate:
              type: string
              format: date
              nullable: true
              example: "2025-03-31"
            dueDate:
              type: string
              format: date
              nullable: true
              example: "2025-03-25"
            completionDate:
              type: string
              format: date
              nullable: true
              example: "2025-03-20"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "22222222-3333-4444-5555-666666666666"
        taskId:
          type: string
          example: "T001"
        phaseId:
          type: string
          format: uuid
          example: "11111111-2222-3333-4444-555555555555"
        meetingId:
          type: string
          example: "01234567-89ab-cdef-0123-456789abcdef"
        phaseNumber:
          type: integer
          example: 1
        title:
          type: string
          example: "Prepare proxy statement"
        description:
          type: string
          nullable: true
          example: "Draft and review the preliminary proxy statement for the annual meeting"
        type:
          type: string
          example: "DOCUMENT_PREPARATION"
        status:
          $ref: '#/components/schemas/TaskStatus'
        dueDate:
          type: string
          format: date
          nullable: true
          example: "2025-03-15"
        owner:
          type: string
          example: "Legal Team"
        documentId:
          type: string
          format: uuid
          nullable: true
          example: "33333333-4444-5555-6666-777777777777"
        links:
          type: object
          nullable: true
        createdAt:

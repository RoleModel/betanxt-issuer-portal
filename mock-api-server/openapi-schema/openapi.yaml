        state:
          type: string
          nullable: true
          maxLength: 2
          description: US state code of the holder's address; null when unknown.
          example: "NC"
        country:
          type: string
          nullable: true
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code.
          example: "US"

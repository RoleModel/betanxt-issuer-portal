  # Position Management Endpoints (Supabase PostgREST)
  /positions:
    get:
      operationId: listPositions
      summary: List positions
      description: |
        List positions with Supabase PostgREST filters.

        Common usage:
        - Filter by meeting: `?meetingId=eq.wen-annual-meeting-2025`
        - Filter by vote status: `?voteStatus=eq.Voted` or `?voteStatus=eq.Unvoted`
        - Filter by account type: `?accountType=eq.CEDE%20%26%20CO%20%2F%20CTC%20%26%20CO`
        - Include meeting data: `?select=*,meetings(*)`
        - Include position votes: `?select=*,position_votes(*)`
        - Order by shares: `?order=shares.desc`
        - Pagination: `?limit=20&offset=40`
      tags: [Positions]
      parameters:
        - name: meetingId
          in: query
          required: false
          schema:
            type: string
          description: Filter by meeting ID (e.g., `eq.WEN-2024-AGM`)
        - name: voteStatus
          in: query
          schema:
            type: string
          description: Filter by vote status (e.g., `eq.Voted`, `eq.Unvoted`)
        - name: accountType
          in: query
          schema:
            type: string
          description: Filter by account type (e.g., `eq.Registered Account`)
        - name: select
          in: query
          schema:
            type: string
          description: Specify columns to return and embed related resources
        - name: order
          in: query
          schema:
            type: string
          description: Order results (e.g., `shares.desc`, `name.asc`)
        - name: limit
          in: query
          schema:
            type: integer
          description: Limit number of results
        - name: offset
          in: query
          schema:
            type: integer
          description: Number of results to skip for pagination
      responses:
        "200":
          description: Positions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createPosition
      summary: Create new position
      tags: [Positions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePositionRequest"
      responses:
        "201":
          description: Position created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


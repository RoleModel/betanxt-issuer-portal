  /position_votes:
    get:
      operationId: getPositionVotes
      summary: Get position votes
      description: |
        Get position votes using Supabase PostgREST filters.

        Common usage examples:
        - Get votes for a position: `?positionId=eq.{uuid}`
        - Get votes for a proposal: `?proposalId=eq.{uuid}`
        - Include related data: `?select=*,positions(*),proposals(*)`
        - Order by date: `?order=createdAt.desc`

        Supabase operators:
        - `eq` - equals
        - `neq` - not equals
        - `gt` - greater than
        - `gte` - greater than or equal
        - `lt` - less than
        - `lte` - less than or equal
        - `like` - LIKE operator
        - `ilike` - ILIKE operator
        - `in` - one of a list of values
        - `is` - checking for null/not null
      tags: [Voting]
      parameters:
        - name: positionId
          in: query
          required: false
          schema:
            type: string
          description: Filter by position ID (e.g., `eq.123e4567-e89b-12d3-a456-426614174000`)
        - name: proposalId
          in: query
          required: false
          schema:
            type: string
          description: Filter by proposal ID (e.g., `eq.123e4567-e89b-12d3-a456-426614174000`)
        - name: vote
          in: query
          required: false
          schema:
            type: string
          description: Filter by vote type (e.g., `eq.FOR`, `eq.AGAINST`, `eq.ABSTAIN`)
        - name: select
          in: query
          required: false
          schema:
            type: string
          description: Specify columns and embed related resources (e.g., `*,positions(name,cusip)`)
        - name: order
          in: query
          required: false
          schema:
            type: string
          description: Order results (e.g., `createdAt.desc`, `sharesVoting.asc`)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Limit number of results
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: Number of results to skip for pagination
      responses:
        "200":
          description: Position votes retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PositionVote"
          headers:
            Content-Range:
              description: Pagination info (e.g., `0-9/100`)
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createPositionVote
      summary: Create a position vote
      description: |
        Create a new position vote record.

        Note: In Supabase PostgREST, you POST directly to the table endpoint.
        The positionId should be included in the request body, not the URL path.
      tags: [Voting]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CastVoteRequest"
      responses:
        "201":
          description: Vote cast successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionVote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # Comments Endpoints
  /documents/{id}/comments:
    get:
      operationId: getDocumentComments
      summary: Get comments for a document
      tags: [Comments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comments retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: addComment
      summary: Add comment to a document
      tags: [Comments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /documents/{id}/events:
    get:
      operationId: getDocumentEvents
      summary: Get event history for a specific document
      tags: [Documents]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentHistory"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: addDocumentEvent
      summary: Add event to document history
      tags: [Documents]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType]
              properties:
                eventType:
                  type: string
                  enum:
                    [
                      CREATED,
                      UPLOADED,
                      VIEWED,
                      DOWNLOADED,
                      NOT_UPLOADED,
                      SIGNED,
                      APPROVED,
                      REJECTED,
                      COMMENTED,
                      UPDATED,
                      DELETED,
                    ]
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Event added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # Notification Management Endpoints
  /notifications:
    get:
      operationId: listNotifications
      summary: List user notifications
      tags: [Notifications]
      parameters:
        - name: userId
          in: query
          description: Filter notifications by user ID (scopes results to a specific user)
          schema:
            type: string
        - name: username
          in: query
          description: Resolve user by username when the session user ID is not seeded in the database
          schema:
            type: string
            example: "csm.user"
        - name: ticker
          in: query
          description: Filter notifications by client ticker
          schema:
            type: string
            example: "WEN"
        - name: meetingId
          in: query
          description: Filter notifications by meeting ID
          schema:
            type: string
            example: "wen-annual-meeting-2026"
        - name: read
          in: query
          description: Filter by read status
          schema:
            type: boolean
        - name: type
          in: query
          description: Filter by notification type
          schema:
            type: string
            enum: [info, warning, error, success, unread, read]
        - name: priority
          in: query
          description: Filter by priority level
          schema:
            type: string
            enum: [low, medium, high, critical]
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createNotification
      summary: Create an in-app notification
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationInput"
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cron/tabulation-distribute:
    post:
      operationId: runTabulationDistribute
      summary: Run daily tabulation report distribution
      description: >
        Finds all meetings with auto-distribution enabled and within their delivery window,
        creates in-app notifications for every user associated with the meeting, and sends
        emails to configured recipients. Intended to be called by a daily cron job at 8 AM,
        but can also be triggered manually from the distribution settings drawer.
      tags: [Cron]
      responses:
        "200":
          description: Distribution run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TabulationDistributeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Internal server error

  /notifications/{notificationId}/mark-read:
    patch:
      operationId: markNotificationRead
      summary: Mark notification as read
      tags: [Notifications]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    # Enums
    UserType:
      type: string
      enum: [ADMIN, ISSUER, RELATIONSHIP_MANAGER]

    MeetingStatus:
      type: string
      enum: [ACTIVE, COMPLETE, ADJOURNED]

    PhaseStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETE]

    TaskStatus:
      type: string
      enum:
        [
          INCOMPLETE,
          COMPLETE,
          CANCELLED,
          NEEDS_AUTHORIZATION,
          AUTHORIZED,
          PENDING_AUTHORIZATION,
          WAITING_FOR_FORM_RETURN,
          AUTHORIZATION_NEEDED,
          SUBMITTED_AWAITING_RECORD_DATE,
          REQUEST_FORM_TO_FOLLOW,
          AWAITING_REVIEW,
        ]

    DocumentStatus:
      type: string
      enum:
        [
          DRAFT,
          AWAITING_DRAFT,
          AWAITING_REVIEW,
          APPROVED,
          UPLOADED,
          IN_PROGRESS,
          SIGNED,
          AUTHORIZED,
          COMPLETED,
        ]

    # Core Models
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        primaryContact:
          type: string
        clientId:
          type: string
          format: uuid
          description: The client this account belongs to
        createdAt:
          type: string
          format: date-time
        client:
          $ref: "#/components/schemas/Clients"
          description: The client this account belongs to (relationship)

    Clients:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "291cdbe5-192b-50ec-b3ae-3197c9c5103c"
        ticker:
          type: string
          description: Unique ticker symbol for the client
          example: "WEN"
        companyName:
          type: string
          description: Full legal name of the company
          example: "The Wendy's Company"
        shortName:
          type: string
          description: Short display name for the company
          example: "Wendy's"
        industry:
          type: string
          nullable: true
          description: Industry sector
          example: "Restaurants"
        description:
          type: string
          nullable: true
          description: Company description
          example: "Leading fast food hamburger chain"
        website:
          type: string
          nullable: true
          description: Company website URL
          example: "https://www.wendys.com"
        primaryContact:
          type: string
          nullable: true
          description: Primary contact person
          example: "Mike Chen"
        primaryContactEmail:
          type: string
          format: email
          nullable: true
          description: Primary contact email
          example: "mike.chen@wendys.com"
        isActive:
          type: boolean
          default: true
          description: Whether the client is active
          example: true
        brandingId:
          type: integer
          nullable: true
          description: Unique branding identifier for document hosting site URLs
          example: 966152
        logoUrl:
          type: string
          nullable: true
          description: URL of the client's logo image
        primaryColor:
          type: string
          nullable: true
          description: Primary brand color as a hex string (e.g. #1A3C5E)
          example: "#1A3C5E"
        secondaryColor:
          type: string
          nullable: true
          description: Secondary brand color as a hex string (e.g. #E8A020)
          example: "#E8A020"
        createdBy:
          type: string
          nullable: true
          description: Username of the CSM who created this client (for assignment)
        enabledFeatures:
          type: array
          items:
            type: string
            enum:
              - documents
              - mailing
              - tabulation
              - reports
              - fileTransfer
              - agenda
              - nobo
          description: Feature modules enabled for this client. "nobo" is present when Engage functionality is active.
          example: ["documents", "mailing", "tabulation", "reports", "fileTransfer", "agenda"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "b1f5062a-09b6-5dc1-b18c-3800c5930eab"
        username:
          type: string
          example: "lisa.rodriguez"
        firstName:
          type: string
          example: "Lisa"
        lastName:
          type: string
          example: "Rodriguez"
        email:
          type: string
          format: email
          example: "lisa.rodriguez@paycom.com"
        password:
          type: string
          nullable: true
          description: "Legacy password field for seed data - not used with NextAuth"
        type:
          $ref: "#/components/schemas/UserType"
          example: "ISSUER"
        accountId:
          type: string
          format: uuid
          nullable: true
          example: "fe3ad07a-80a7-59a0-a253-9083d6d4c02c"
        account:
          $ref: "#/components/schemas/Account"
        avatar_url:
          type: string
          format: uri
          nullable: true
          description: URL of the user's profile photo stored in Supabase Storage
          example: https://example.supabase.co/storage/v1/object/public/user-avatars/b1f5062a-09b6-5dc1-b18c-3800c5930eab.jpg

    Meeting:
      type: object
      properties:
        id:
          type: string
          example: "wen-annual-meeting-2026"
        title:
          type: string
          example: "Annual Meeting"
        cusip:
          type: string
          example: "95058W100"
        ticker:
          type: string
          example: "WEN"
        preFilingDate:
          type: string
          format: date
          nullable: true
          example: "2025-02-15"
        filingDate:
          type: string
          format: date
          nullable: true
          example: "2025-03-01"
        brokerSearchDate:
          type: string
          format: date
          nullable: true
          example: "2025-03-15"
        recordDate:
          type: string
          format: date
          example: "2025-04-01"
        mailingDate:
          type: string
          format: date
          example: "2025-04-15"
        meetingDate:
          type: string
          format: date
          example: "2025-05-15"
        cutoffDate:
          type: string
          format: date
          nullable: true
          description: Voting cutoff date (previous business day before meeting)
        meetingType:
          type: string
        meetingYear:
          type: integer
          example: 2025
        status:
          $ref: "#/components/schemas/MeetingStatus"
        currentPhase:
          type: string
          example: "Notice & Access"
        overallCompletion:
          type: integer
          minimum: 0
          maximum: 100
          example: 75
        distributionType:
          type: string
          example: "Notice & Access"
        transferAgent:
          type: string
          example: "Computershare Trust Company"
        transferAgentConfirmed:
          type: boolean
          nullable: true
          default: false
          description: Whether the transfer agent has been confirmed (demo feature)
        employeeStockPlans:
          type: string
          nullable: true
        planAdministrator:
          type: string
          nullable: true
        planAdministratorContact:
          type: string
          nullable: true
        planAdministratorContactEmail:
          type: string
          format: email
          nullable: true
        solicitor:
          type: string
          nullable: true
        solicitorEmail:
          type: string
          format: email
          nullable: true
        inspector:
          type: string
          nullable: true
        ivrDialInNumber:
          type: string
          nullable: true
          description: IVR dial-in voting number (e.g., "1-800-555-VOTE")
        totalSharesOutstanding:
          type: string
          format: int64
        quorumRequirement:
          type: number
          format: decimal
        brokerNonVote:
          type: number
          nullable: true
          description: "Total broker non-votes for this meeting"
          example: 22480600.00
        mailingStatus:
          type: string
          nullable: true
          description: Current status of the mailing process for this meeting
        clientId:
          type: string
          format: uuid
          description: The client this meeting belongs to
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tabulationDistribution:
          $ref: "#/components/schemas/TabulationDistribution"
          nullable: true
          description: Prototype config for automated daily tabulation report delivery
        client:
          $ref: "#/components/schemas/Clients"
          description: The client this meeting belongs to (relationship)

    TabulationDistribution:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether auto-delivery of daily tabulation reports is enabled
        startOffsetDays:
          type: integer
          default: 15
          description: How many days before meeting date to start delivering reports
        recipients:
          type: array
          items:
            type: string
            format: email
          description: Email addresses to receive daily tabulation reports
        lastSentAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last automated delivery
        nextScheduledAt:
          type: string
          format: date-time
          nullable: true
          description: Computed next delivery timestamp (prototype display only)

    Phase:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "11111111-2222-3333-4444-555555555555"
        meetingId:
          type: string
          format: uuid
          x-foreign-key: meeting.id
          example: "01234567-89ab-cdef-0123-456789abcdef"
        name:
          type: string
          example: "Notice & Access"
        orderIndex:
          type: integer
          example: 1
        status:
          $ref: "#/components/schemas/PhaseStatus"
        keyDates:
          type: object
          nullable: true
          properties:
            startDate:
              type: string
              format: date
              nullable: true
              example: "2025-03-01"
            endDate:
              type: string
              format: date
              nullable: true
              example: "2025-03-31"
            dueDate:
              type: string
              format: date
              nullable: true
              example: "2025-03-25"
            completionDate:
              type: string
              format: date
              nullable: true
              example: "2025-03-20"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "81c351e9-36cd-5528-b5a4-f48b2fe05bd6"
        taskId:
          type: string
          example: "wen-annual-meeting-2026-P1-1"
        phaseId:
          type: string
          format: uuid
          example: "11111111-2222-3333-4444-555555555555"
        meetingId:
          type: string
          example: "wen-annual-meeting-2026"
        phaseNumber:
          type: integer
          example: 1
        title:
          type: string
          example: "DTCC (SPR) Authorization Status"
        description:
          type: string
          nullable: true
          example: "Check and confirm authorization status with DTCC for shareholder proxy record access."
        type:
          type: string
          example: "Authorization"
        status:
          $ref: "#/components/schemas/TaskStatus"
          example: "NEEDS_AUTHORIZATION"
        dueDate:
          type: string
          format: date
          nullable: true
          example: "2025-12-22"
        owner:
          type: string
          example: "The Wendy's Company"
        documentId:
          type: string
          format: uuid
          nullable: true
          example: "33333333-4444-5555-6666-777777777777"
        links:
          type: object
          additionalProperties: {}
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        meetingId:
          type: string
        taskId:
          type: string
          format: uuid
          nullable: true
        participantId:
          type: string
          format: uuid
          nullable: true
          description: ID of the DSM participant this document is assigned to
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
        filePath:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
        status:
          $ref: "#/components/schemas/DocumentStatus"
        uploadDate:
          type: string
          format: date-time
          nullable: true
        uploadedDate:
          type: string
          format: date-time
          nullable: true
        signedDate:
          type: string
          format: date-time
          nullable: true
        authorizedDate:
          type: string
          format: date-time
          nullable: true
        completedDate:
          type: string
          format: date-time
          nullable: true
        inProgressDate:
          type: string
          format: date-time
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        history:
          type: object
          additionalProperties: true
          nullable: true
        approvedBy:
          type: string
          nullable: true
          description: User who approved the document
        approvedAt:
          type: string
          format: date-time
          nullable: true
          description: When the document was approved
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: User ID who created the document
        createdByFirstName:
          type: string
          nullable: true
          description: First name of user who created the document
        createdByLastName:
          type: string
          nullable: true
          description: Last name of user who created the document
        updatedBy:
          type: string
          format: uuid
          nullable: true
          description: User ID who last updated the document
        updatedByFirstName:
          type: string
          nullable: true
          description: First name of user who last updated the document
        updatedByLastName:
          type: string
          nullable: true
          description: Last name of user who last updated the document
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        displayCategory:
          type: string
          nullable: true
          description: Category for filtering document display (general, dsm, proxy-materials, meeting-materials, post-meeting, internal)
          enum:
            - general
            - dsm
            - proxy-materials
            - meeting-materials
            - post-meeting
            - internal
        meeting:
          $ref: "#/components/schemas/Meeting"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        signatures:
          type: array
          items:
            $ref: "#/components/schemas/Signature"

    Position:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "90953927-6e41-5c55-be8b-a690299746ad"
        meetingId:
          type: string
          format: uuid
          x-foreign-key: meeting.id
          example: "01234567-89ab-cdef-0123-456789abcdef"
        cusip:
          type: string
          example: "95058W100"
        accountType:
          type: string
          example: "DTC/CDS"
        setKey:
          type: string
          example: "WEN12026"
        name:
          type: string
          example: "CEDE & CO M C/O DTCC"

          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Proposal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "be601464-c593-5d74-b6f6-c14152132103"
        meetingId:
          type: string
          format: uuid
          x-foreign-key: meeting.id
          example: "01234567-89ab-cdef-0123-456789abcdef"
        proposalNumber:
          type: number
          format: double
          example: 1.01
        proposalTitle:
          type: string
          example: "Arthur B. Winkleblack"
        proposalType:
          type: string
          example: "Director Election"
        proposalSubtype:
          type: string
          nullable: true
          example: null
        directorName:
          type: string
          nullable: true
          example: "Arthur B. Winkleblack"
        directorTermYears:
          type: integer
          nullable: true
          example: 3

          type: string
          nullable: true
        termExpirationYear:
          type: integer
          nullable: true
        frequencyOptions:
          type: object
          nullable: true
        recommendation:
          type: string
        # Proposal Result Tracking
        finalResult:
          type: string
          nullable: true
          enum: ["PASSED", "FAILED", "PENDING"]
          description: "Final result of the proposal voting"
          example: "PASSED"
        totalVotesFor:
          type: number
          nullable: true
          description: "Total number of votes in favor"
          example: 150000000.19
        totalVotesAgainst:
          type: number
          nullable: true
          description: "Total number of votes against"
          example: 25000000.39
        totalVotesAbstain:
          type: number
          nullable: true
          description: "Total number of abstained votes"
          example: 5000000.21
        totalSharesEligible:
          type: number
          nullable: true
          description: "Total number of shares eligible to vote"
          example: 200000000
        forPercentage:
          type: number
          format: float
          nullable: true
          description: "Percentage of votes in favor"
          example: 85.7
        againstPercentage:
          type: number
          format: float
          nullable: true
          description: "Percentage of votes against"
          example: 12.5
        abstainPercentage:
          type: number
          format: float
          nullable: true
          description: "Percentage of abstained votes"
          example: 2.5
        participationRate:
          type: number
          format: float
          nullable: true
          description: "Overall participation rate"
          example: 90.0
        votingCompleted:
          type: boolean
          default: false
          description: "Whether voting on this proposal has been completed"
        votingCompletedAt:
          type: string
          format: date-time
          nullable: true
          description: "When voting was completed"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


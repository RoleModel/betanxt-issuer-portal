          type: string
          nullable: true
          enum: [WEB, PRINT, IVR]
        dateVoted:
          type: string
          nullable: true
        holderCategory:
          type: string
          nullable: true
          enum: [REGISTERED, PLAN, BENEFICIAL, NOBO]

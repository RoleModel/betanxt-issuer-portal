        finalResult:
          type: string
          nullable: true
          enum: ["PASSED", "FAILED", "PENDING"]
          description: "Final result of the proposal voting"
          example: "PASSED"
        totalVotesFor:
          type: integer
          nullable: true
          description: "Total number of votes in favor"
          example: 150000000
        totalVotesAgainst:
          type: integer
          nullable: true
          description: "Total number of votes against"
          example: 25000000
        totalVotesAbstain:
          type: integer
          nullable: true
          description: "Total number of abstained votes"
          example: 5000000
        totalSharesEligible:
          type: integer
          nullable: true
          description: "Total number of shares eligible to vote"
          example: 200000000
        forPercentage:
          type: number
          format: float
          nullable: true
          description: "Percentage of votes in favor"
          example: 85.7
        againstPercentage:
          type: number
          format: float
          nullable: true
          description: "Percentage of votes against"
          example: 12.5
        abstainPercentage:
          type: number
          format: float
          nullable: true
          description: "Percentage of abstained votes"
          example: 2.5
        participationRate:
          type: number
          format: float
          nullable: true
          description: "Overall participation rate"
          example: 90.0
        votingCompleted:
          type: boolean
          default: false
          description: "Whether voting on this proposal has been completed"

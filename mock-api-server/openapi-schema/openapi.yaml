    TabulationReport:
      type: object
      required:
        - id
        - meetingId
      properties:
        id:
          type: string
          format: uuid
          x-sql-type: UUID
          description: Primary key
        meetingId:
          type: string
          description: Foreign key to meeting table
          x-sql-type: TEXT
        setKeys:
          type: array
          items:
            type: string
          description: Unique set keys from position records
          x-sql-type: TEXT[]
        brokerVoting:
          type: object
          description: Top brokers by total shares, keyed by proposal (e.g. proposal1, proposal2)
          x-sql-type: JSONB
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                broker:
                  type: string
                sharesFor:
                  type: number
                sharesAgainst:
                  type: number
                sharesAbstain:
                  type: number
        shareRangePerformance:
          type: array
          description: Performance metrics across 18 share ranges
          x-sql-type: JSONB
          items:
            type: object
            properties:
              rangeLabel:
                type: string
              positionCount:
                type: integer
              totalShares:
                type: number
              percentVoted:
                type: number
        nonDtcVoteStatus:
          type: object
          description: Non-DTC shareholder vote status breakdown
          x-sql-type: JSONB
          properties:
            unvotedShareholders:
              type: integer
            unvotedShares:
              type: number
            printShareholders:
              type: integer
            printShares:
              type: number
            ivrShareholders:
              type: integer
            ivrShares:
              type: number
            webShareholders:
              type: integer
            webShares:
              type: number
            votedSubtotalShareholders:
              type: integer
            votedSubtotalShares:
              type: number
            grandTotalShareholders:
              type: integer
            grandTotalShares:
              type: number
        dtcVoteStatus:
          type: object
          description: DTC/CDS shareholder vote status breakdown
          x-sql-type: JSONB
          properties:
            unvotedShareholders:
              type: integer
            unvotedShares:
              type: number
            votedShareholders:
              type: integer
            votedShares:
              type: number
            grandTotalShareholders:
              type: integer
            grandTotalShares:
              type: number
        voteDistribution:
          type: object
          description: Overall vote distribution by account type
          x-sql-type: JSONB
          properties:
            dtcVotedShares:
              type: number
            dtcUnvotedShares:
              type: number
            nonDtcVotedShares:
              type: number
            nonDtcUnvotedShares:
              type: number
        positionsVoted:
          type: object
          description: Positions voted by shareholder type
          x-sql-type: JSONB
          properties:
            voted:
              type: integer
            unvoted:
              type: integer
            totalShares:
              type: number
            votedShares:
              type: number
        lastCalculatedAt:
          type: string
          format: date-time
          description: Timestamp of last statistics calculation
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

